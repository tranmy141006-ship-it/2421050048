<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao tao Humg</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <li class="muc"><a href="#" class="lien-ket">Thực tập,Đồ án</a></li>
                <li class="muc"><a href="#" class="lien-ket">Thủ tục Một Cửa</a></li>
                <li class="muc"><a href="#" class="lien-ket">Một Cửa online</a></li>
                <li class="muc"><a href="#" class="lien-ket">E-Mail HUMG</a></li>
            </ul>  
        </nav>
        <main>
            <div class="trai">
                <div class="khoi-dang-nhap">
                    <form action="">
                        <div class="khoi-thong-tin">
                            <p>Taì khoản</p>
                            <input type="text" name="tai-khoan">
                        </div>
                        <div class="khoi-mat-khau">
                            <p>Mật khẩu</p>
                            <input type="password" name="mat-khau">
                        </div>
                        <div class="quen-mat-khau">
                            <a class="quen-mat-khau-lien-ket">Quên mật khẩu?</a>
                        </div>
                        <div>
                            <button class="login">Đăng nhập</button>
                            <button class="login">Đăng nhập với Microsoft Office</button>
                        </div>

                    </form>
                </div>
            </div>
            <div class="phai">
                <div class="danh-sach-tin">
                    <div class="tin">
                        <div class="chuc-nang">
                            <div class="tieu-de">Tin tức</div>
                            <div class="xem-tiep">Xem tiếp</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

</body>
</html>
