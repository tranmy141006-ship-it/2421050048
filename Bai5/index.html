<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* Loại 2: internal style */
        h2{
            /* color dùng để qui định màu chữ */
            color:red; 
        }
        #tieuDe{
            color: orange;
        }
    </style>
</head>
<body>
    <!-- I -->
    <!-- kiểu 1 viết style trong thẻ -->
     <!--loại 1: Inline style -->
    <h1 style="color: blue;">HUMG</h1>

    <!-- kiểu 2 viết ngoài thẻ  -->
     <h2>Trường đại học Mỏ - Địa chất</h2>

     <h3>Lớp phát triển ứng dụng web 03</h3>
     <!-- II. selector -->
     <!-- cách 1: dùng tên thẻ -->
    <!-- cách 2 dùng id -->
    <!-- cách 3 : dùng class(viết dấu chấm trước tên class) -->
     <h2 id="tieuDe" class="tieuDe">Trường đại học Mỏ-Địa chất</h2>
     <h3 class="tieuDe2">Lớp phát triển ứng dụng web</h3>
 </body>   
</html>
