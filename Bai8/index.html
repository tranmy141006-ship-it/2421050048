<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai8</title>
</head>
<body>
    <script>
        //fucntion
        //k tham so
        function sayHello(){
            document.writeln("Hello");
            
        }
        sayHello();

        //có tham số
         function sayHello2(ten){
            document.writeln("<br>Xin chào bạn " + ten);
            
        }
        sayHello2("Quang Anh");
        sayHello2("Ly");
        sayHello2("Thang");

        
        function tinhTong(a,b){
            if(isNaN(a) == false && isNaN(b) == false){
                document.write(a+b);
            }
        }
        var soThuNhat = prompt("Nhập số thứ 1" ,"");
        var soThuHai = prompt("Nhập số thứ 2" ,"");
        tinhTong(soThuNhat+soThuHai);

    </script>
</body>
</html>
