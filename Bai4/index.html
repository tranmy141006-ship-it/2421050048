<html>
    <head>
        <title>bai 4</title>
    </head>
    <body>
       <h1>form tạo thông tin</h1>
        <form>
            <!-- Input nếu k truyền type thì type mặc định là text -->
           <div>
               <p><b>Họ và Tên</b></p>
               <input type="text" name="hoVaTen">
           </div>
            <div>
               <p><b>Giới thiệu</b></p>
               <textarea name="gioiThieu"></textarea>
            </div>
            <div>
                <p><b>Email</b></p>
                <input type="email" name="email">
            </div>
                <!-- số đầu tiên: 0 -->
                <!-- Số tiếp theo: 9,3,6,8 -->
                <!-- 8 số cuối: 0-9 -->
             <div>
                <p><b>Số điện thoại</b></p>
                <input name="soDienThoai" type="tel" 
                placeholder="Dạng số 123"
                required
                pattern="([0]{1}) ([9,3,6,8]{1}) ([0-9]{8})">
            </div>
            <div>
                <p><b>Giới tính</b></p>
                <input type="radio" name="gioiTinh" value="nam">Nam<br>
                <input type="radio" name="gioiTinh" value="nữ">Nữ
            </div>
            <div>
                <p><b>Sở thích</b></p>
               Game: <input type="checkbox" name="soThich" value="game"><br>
               Music: <input type="checkbox" name="soThich" value="music"><br>
               Aport: <input type="checkbox" name="soThich" value="aport">
            </div>
            <div>
                <p><b>Trình duyệt web hay sử dụng</b></p>
                   <input list="browsers">
                    <datalist id="browsers">
                    <option value="Internet Explorer">
                    <option value="Firefox">
                    <option value="Chrome">
                    <option value="Opera">
                    
                </datalist>
             <select name="browsers">
                <option value="Internet Explorer">Internet Explorer</option>
                <option value="Firefox">Firefox</option>
                <option value="Chrome">Chrome</option>
                <option value="Opera">Opera</option>
                <option value="Safari">Safari</option>
                <option value="Cốc cốc">Cốc cốc</option>
                    
             </select>   
            </div>
            <div> 
                0 <input type="range" id="a" value="50">100
            </div>
                <input type="submit">
                <button>click</button>
                <input type="reset">
            </div>
            <iframe 
            width="560"
            height="315" 
            src="https://www.youtube.com/embed/nwG87GGMgHI?si=ci512Kt2PTHETvyZ" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen></iframe>
        </form>   
         
        <MARQUEE>
            <img src="/anh/meme.jpg" alt="Meme">
        </MARQUEE>

        <audio controls>
            <source src="/audio/music.mp3" type="audio/mpeg">
        </audio>

        <video controls>
            <source src="/video/video.mp4" type="video/mp4">
        </video>
    </body>
</html>
